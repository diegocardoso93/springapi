# Define upstream for PHP-FPM service
upstream php-fpm {
    # 'app' is the service name defined in docker-compose.yml
    server app:9000;
}

server {
    listen 80;
    server_name localhost; # Or your development domain
    root /var/www/html/public; # Laravel's public directory
    index index.php index.html index.htm;

    # Set client body size (adjust if needed for large uploads)
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm; # Reference the upstream defined above
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Set higher timeouts if needed
        # fastcgi_read_timeout 300;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Add expires headers for static assets (optional performance improvement)
    location ~* \.(?:jpg|jpeg|gif|png|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
